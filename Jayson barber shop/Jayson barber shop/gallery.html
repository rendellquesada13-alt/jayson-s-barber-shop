<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Jayson's Cut</title>
    <link rel="icon" type="image/png" href="cut-scissors.gif">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #EDE7D9;
            background: #000;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: #EDE7D9;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header */
        header {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: bold;
            color: #EDE7D9;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            font-size: 16px;
            font-weight: 500;
            color: #EDE7D9;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #d1a570;
        }

        /* Gallery Section */
        #gallery {
            padding: 80px 40px;
            text-align: center;
        }

        #gallery h2 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #d1a570;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* Footer */
        footer {
            background-color: #1A1A1A;
            color: #b38a5c;
            text-align: center;
            padding: 40px 20px;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Jayson's Cut</h1>
        <nav>
            <ul>
                <li><a href="barberhome.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="book.html">Book Now</a></li>
                <li><a href="help.html">Help</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="cut2.jpg" alt="Gallery Image 1">
            </div>
            <div class="gallery-item">
                <img src="cut3.jpg" alt="Gallery Image 2">
            </div>
            <div class="gallery-item">
                <img src="cut4.jpg" alt="Gallery Image 3">
            </div>
            <div class="gallery-item">
                <img src="cutt (1).png"Gallery Image 4">
            </div>
            <div class="gallery-item">
                <img src="cut (1).png" alt="Gallery Image 5">
            </div>
            <div class="gallery-item">
                <img src="cut (2).png" alt="Gallery Image 6">
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Jayson's Cut. All rights reserved.</p>
    </footer>
</body>
</html>
