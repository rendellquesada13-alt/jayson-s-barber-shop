<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Jayson's Cut</title>
    <link rel="icon" type="image/png" href="cut-scissors.gif">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: url('chair.jpg') no-repeat center center/cover;
            color: #333;
        }
        header {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #EDE7D9;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: bold;
        }
        .container {
            max-width: 600px;
            margin: 80px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 20px;
            color: #1A1A1A;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select, textarea {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            background-color: #d1a570;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #b38a5c;
        }


        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            font-size: 16px;
            font-weight: 500;
            color: #EDE7D9;
            text-decoration: none;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #d1a570;
        }


    </style>
</head>
<body>
    <header>
        <h1 class="logo">Jayson's Cut</h1>
        <nav>
            <ul>
                <li><a href="barberhome.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="book.html">Book Now</a></li>
                <li><a href="help.html">Help</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h2>Book an Appointment</h2>
        <form action="#" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="service">Select Service</label>
            <select id="service" name="service" required>   
                <option value="haircut">Haircut</option>
                <option value="beard-trim">Beard Trim</option>
                <option value="styling">Styling</option>
            </select>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>

            <label for="message">Additional Notes</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit" class="btn">Confirm Booking</button>
        </form>
    </div>
</body>
</html>
