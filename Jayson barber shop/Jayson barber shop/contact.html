<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jayson's Cut</title>
    <link rel="icon" type="image/png" href="cut-scissors.gif">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background: url('cover2.jpg') no-repeat center center/cover;
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            color: #222;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .btn {
            background-color: #d1a570;
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 5px;
            transition: background 0.3s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #b38a5c;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(26, 26, 26, 0.9);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: bold;
            color: #EDE7D9;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            font-size: 16px;
            font-weight: 500;
            color: #EDE7D9;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #d1a570;
        }

        /* Contact Section */
        #contact {
            padding: 80px 10%;
            background-color: rgba(237, 231, 217, 0.9);
            text-align: center;
        }

        #contact h2 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #1A1A1A;
        }

        .contact-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 50px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .profile-picture {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contact-form {
            flex: 1;
            max-width: 600px;
            text-align: left;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .contact-form textarea {
            resize: vertical;
            height: 150px;
        }

        .contact-form button {
            width: 100%;
        }

        /* Footer */
        footer {
            background-color: #1A1A1A;
            color: #b38a5c;
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Jayson's Cut</h1>
        <nav>
            <ul>
                <li><a href="barberhome.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="book.html">Book Now</a></li>
                <li><a href="help.html">Help</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Contact Section -->
        <section id="contact">
            <h2>Contact Me</h2>
            <div class="contact-container">
                <div class="profile-picture">
                    <img src="jayson.jpg" alt="Jayson's Profile Picture">
                </div>
                <form class="contact-form" action="#" method="POST">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Jayson's Cut. All rights reserved.</p>
    </footer>
</body>
</html>
